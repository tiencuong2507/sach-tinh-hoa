<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lễ cúng — Sách Tinh Hoa</title>
<style>
:root{--bg:#f7f3ea;--card:#fff;--ink:#222;--mute:#6b6253;--acc:#8b2e1f;--line:#e2dccf;--tot:#1e6b3a;--xau:#a3261a;--khan:#fffbe9}
body{font-family:"Segoe UI",system-ui,sans-serif;max-width:960px;margin:auto;padding:12px 16px 60px;background:var(--bg);color:var(--ink);line-height:1.65}
h1{text-align:center;margin:8px 0 4px;color:var(--acc)}h2{margin:.3em 0}h3{margin:1.1em 0 .3em;color:var(--acc)}h4{margin:.8em 0 .2em}
.sub{text-align:center;color:var(--mute);margin-bottom:10px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
nav button,.btn{padding:7px 14px;border:1px solid #b9ae98;background:#fff;border-radius:6px;cursor:pointer;font-size:15px;color:var(--ink);text-decoration:none;display:inline-block}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select{padding:8px;font-size:16px;border:1px solid #b9ae98;border-radius:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
a.le{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);text-decoration:none}
a.le:hover{border-color:var(--acc)}a.le b{color:var(--acc)}
.zh{font-family:"Noto Serif TC","PMingLiU","SimSun",serif;color:#444}
.mute{color:var(--mute);font-size:.92em}
.tag{display:inline-block;background:#efe7d6;border-radius:4px;padding:0 6px;margin-right:4px;font-size:.85em}
.tag.i{background:#fde9c9}.tag.u{background:#f3d9d9}
blockquote{margin:.5em 0;padding:6px 14px;border-left:3px solid var(--acc);background:#faf7f0;font-style:italic}
blockquote .m{display:block;font-style:normal;color:var(--mute);font-size:.88em;margin-top:2px}
.khan{white-space:pre-wrap;background:var(--khan);border:1px solid #eadfae;border-radius:8px;padding:12px 16px;font-size:1.03em;line-height:1.75}
.tb{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95em}.tb th,.tb td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;text-align:left}
.tb th{background:#efe7d6}.tb tr.homnay td{outline:2px solid var(--acc)}
ol,ul{margin:.3em 0 .3em 1.3em;padding:0}li{margin:2px 0}
.hidden{display:none}
.luat{background:#f0f4f7;border:1px solid #d6e0e8;border-radius:8px;padding:8px 14px}
@media print{nav,.noprint{display:none}body{background:#fff}.card{border:none}}
</style></head><body>
<h1>🕯 Lễ cúng</h1>
<div class="sub">Cẩm nang lễ cúng trong nhà cho người thường · tục lệ theo Phan Kế Bính (1915) · bài khấn do kho soạn theo khung Chu Tử gia lễ · không có "chuẩn nhất"</div>
<nav>
 <button data-t="muc-luc" class="on">Mục lục</button>
 <button data-t="lich">Lịch lễ năm nay</button>
 <button data-t="nguon">Nguồn và giới hạn</button>
</nav>

<section id="muc-luc"></section>
<section id="le" class="hidden"></section>
<section id="lich" class="hidden"></section>
<section id="nguon" class="hidden"></section>

<script src="../chung/lich.js"></script><script src="../chung/can-chi.js"></script>
<script src="data/khung.js"></script>
<script src="data/le-quanh-nam.js"></script>
<script src="data/le-vong-doi.js"></script>
<script src="data/le-tang-gio.js"></script>
<script src="app.js"></script>
</body></html>
